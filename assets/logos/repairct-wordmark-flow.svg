<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" role="img" aria-labelledby="title desc">
  <title id="title">Repairct flow wordmark</title>
  <desc id="desc">Selected Repairct wordmark from the Flow Edge concept, for dark backgrounds.</desc>
  <defs>
    <linearGradient id="logoFill" x1="70" x2="860" y1="30" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#eeeeee"/>
      <stop offset="1" stop-color="#a8a8a8"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" x2="1170" y1="204" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
  </defs>
  <g transform="translate(82 20) skewX(-8)">
    <text
      x="0"
      y="160"
      fill="url(#logoFill)"
      font-family="Bahnschrift, 'Arial Narrow', 'Segoe UI', Arial, sans-serif"
      font-size="164"
      font-weight="700"
      letter-spacing="3"
      textLength="760"
      lengthAdjust="spacingAndGlyphs">Repairct</text>
  </g>
  <path d="M92 199 C300 167 505 182 752 151 C918 130 1054 122 1196 129" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
  <path d="M92 222 H1188" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.18"/>
</svg>
